<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>GTA 6 Tips</title>
    <meta
      name="description"
      content="A growing library of GTA 6 tips, gathered from Reddit, news and YouTube every 12 hours. Spoilers redacted."
    />
    <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161514" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved theme before first paint (see src/lib/theme.ts).
      try {
        var t = localStorage.getItem("gta6tips.theme");
        if (t === "light" || t === "dark") {
          document.documentElement.dataset.theme = t;
          var c = t === "dark" ? "#161514" : "#f4f1ea";
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.content = c;
          });
        }
      } catch (e) {}
    </script>
