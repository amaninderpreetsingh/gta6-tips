<h1>Use focus mode to spin out racers</h1>
<p>Clicking both sticks enters a manually controlled slow mode. Use it to line up your car&#39;s front corner with an opponent&#39;s back corner, between their rear wheel and bumper, to spin them out of the race.</p>
