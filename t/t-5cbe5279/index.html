<h1>Find the nearest ATM fast</h1>
<p>Wallet cash is lost if you get Busted or Wasted, but money in your BuckMe bank is safe. Press Down to see both. To bank your cash, press Up, open BuckMe, then ATM Finder, and follow the waypoint to the nearest ATM.</p>
